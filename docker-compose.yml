version: "3.8"

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: ncrtc-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ncrtc_bms
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ncrtc-app
    environment:
      DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/ncrtc_bms?schema=public"
      NEXTAUTH_SECRET: "docker-dev-secret-change-in-production-min-32-chars!!"
      NEXTAUTH_URL: "http://localhost:3000"
      JWT_SECRET: "docker-jwt-secret-change-in-production-min-32-chars!!"
      NODE_ENV: "development"
      LOG_LEVEL: "debug"
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "npx prisma migrate deploy && npx prisma db seed && node server.js"

  tick:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ncrtc-tick
    environment:
      DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/ncrtc_bms?schema=public"
      NODE_ENV: "development"
    depends_on:
      postgres:
        condition: service_healthy
      app:
        condition: service_started
    command: ["npx", "tsx", "src/scripts/tick.ts"]

volumes:
  pgdata:
